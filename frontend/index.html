    <script>
      (function() {
        const storedTheme = localStorage.getItem("osint_theme");
        if (storedTheme === "dark") {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
